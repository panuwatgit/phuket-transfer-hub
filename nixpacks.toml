# Railway/Nixpacks: corepack ที่มากับ Node 24 รัน pnpm 11 ไม่ได้
# (ERR_VM_DYNAMIC_IMPORT_CALLBACK_MISSING) และ npm i -g ไม่เข้า PATH ของ phase ถัดไป
# → เรียก pnpm ผ่าน npx ระบุเวอร์ชันตรงกับ lockfile
[phases.install]
dependsOn = ["setup"]
cmds = ["npx --yes pnpm@11.9.0 install --frozen-lockfile"]

[phases.build]
dependsOn = ["install"]
cmds = ["npx --yes pnpm@11.9.0 run build"]

# ตอนรันจริงใช้ไบนารีใน node_modules ตรง ๆ ไม่ต้องมี pnpm
[start]
cmd = "node_modules/.bin/next start -p ${PORT:-3000}"
