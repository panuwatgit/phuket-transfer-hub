# Railway/Nixpacks: corepack ที่มากับ Node 24 รัน pnpm 11 ไม่ได้
# (ERR_VM_DYNAMIC_IMPORT_CALLBACK_MISSING) → ปิด corepack แล้วลง pnpm ผ่าน npm ตรง ๆ
[phases.install]
dependsOn = ["setup"]
cmds = [
  "corepack disable || true",
  "npm i -g pnpm@11.9.0",
  "pnpm install --frozen-lockfile",
]

[phases.build]
dependsOn = ["install"]
cmds = ["pnpm build"]

[start]
cmd = "pnpm start"
